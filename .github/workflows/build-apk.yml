name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Point Gradle at the preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NJKitchen-v1.3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NJKitchen-APK
          path: NJKitchen-v1.3.apk
      - name: Publish APK as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.3 --yes --cleanup-tag || true
          gh release create v1.3 NJKitchen-v1.3.apk --title "NJ Kitchen v1.3" --notes "Lunch+Dinner doubles meals, per-day lunch/dinner choice, weekends selectable, ₹149 party combo, kids combos, delivery time."
